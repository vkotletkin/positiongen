spring:
  datasource:
    url: jdbc:h2:mem:positiongen;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    aws:
      credentials:
        access-key: positiongen
        secret-key: positiongen-secret
      region:
        static: us-east-1
      s3:
        endpoint: http://localhost:8333
        region: us-east-1
        path-style-access-enabled: true
        chunked-encoding-enabled: false

app:
  storage:
    bucket: positiongen-results
  calculation:
    pool-size: 2
  map:
    origin-latitude: 44.605
    origin-longitude: 33.522
    max-points: 12000
