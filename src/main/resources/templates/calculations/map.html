<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${calculation.label != null ? calculation.label : 'Карта'} + ' — Тотлебен'">Карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="map-page">
    <aside class="side">
        <p><a th:href="@{/}">Все запросы</a></p>
        <h1 th:text="${calculation.label != null ? calculation.label : 'Маршруты'}"></h1>
        <p id="status-panel" th:text="${calculation.statusTitle}" th:attr="data-status=${calculation.status}"></p>
        <p id="report-count" th:text="${calculation.reportCount != null ? 'Отчётов: ' + calculation.reportCount : ''}"
           th:hidden="${calculation.reportCount == null}"></p>
        <p id="notice" class="notice" th:text="${calculation.errorMessage}" th:hidden="${calculation.errorMessage == null}"></p>
        <ul class="meta">
            <li th:text="|Размерность ${calculation.dimension}, фрактальная ${calculation.fractalDimension}|"></li>
            <li th:text="|Мест ${calculation.pointCount}|"></li>
            <li th:text="|Путешественников ${calculation.travelerCount}, на одной траектории ${calculation.coTravelerCount}|"></li>
            <li th:text="|Окно ${calculation.days} сут, в среднем ${calculation.meanReportCount} отчётов|"></li>
            <li th:text="|Привязка плоскости: ${originLatitude}, ${originLongitude}|"></li>
        </ul>
        <div id="downloads" class="downloads" th:hidden="${calculation.status.name() != 'SUCCEEDED'}">
            <a class="button secondary" th:href="@{|/api/calculations/${calculation.id}/files/xy|}">XY.csv</a>
            <a class="button secondary" th:href="@{|/api/calculations/${calculation.id}/files/places|}">PLACES.csv</a>
        </div>
        <div id="legend"></div>
        <p class="hint">Координаты модели — километры по первым двум осям. На карте они сдвинуты от точки привязки, чтобы линии было куда положить.</p>
    </aside>
    <div id="map"
         th:data-id="${calculation.id}"
         th:data-origin-lat="${originLatitude}"
         th:data-origin-lon="${originLongitude}"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/map.js}"></script>
</body>
</html>
