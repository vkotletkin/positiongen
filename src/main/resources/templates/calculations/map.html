<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${calculation.label != null ? calculation.label : 'Map'} + ' — Positiongen'">Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="map-page">
    <aside class="side">
        <p><a th:href="@{/}">All requests</a></p>
        <h1 th:text="${calculation.label != null ? calculation.label : 'Tracks'}">Tracks</h1>
        <p id="status-panel" th:text="${calculation.statusTitle}" th:attr="data-status=${calculation.status}"></p>
        <p id="report-count" th:text="${calculation.reportCount != null ? 'Reports: ' + calculation.reportCount : ''}"
           th:hidden="${calculation.reportCount == null}"></p>
        <p id="notice" class="notice" th:text="${calculation.errorMessage}"
           th:hidden="${calculation.errorMessage == null}"></p>
        <ul class="meta">
            <li th:text="|Dimension ${calculation.dimension}, fractal ${calculation.fractalDimension}|"></li>
            <li th:text="|Places ${calculation.pointCount}|"></li>
            <li th:text="|Travelers ${calculation.travelerCount}, on one trajectory ${calculation.coTravelerCount}|"></li>
            <li th:text="|Window ${calculation.days} days, mean ${calculation.meanReportCount} reports|"></li>
            <li th:text="|Plane origin: ${originLatitude}, ${originLongitude}|"></li>
        </ul>
        <div id="downloads" class="downloads" th:hidden="${calculation.status.name() != 'SUCCEEDED'}">
            <a class="button secondary" th:href="@{|/api/calculations/${calculation.id}/files/xy|}">XY.csv</a>
            <a class="button secondary" th:href="@{|/api/calculations/${calculation.id}/files/places|}">PLACES.csv</a>
        </div>
        <div id="legend"></div>
        <p class="hint">Model coordinates are kilometers along the first two axes. On the map they are offset from the
            origin so the lines have a place to sit.</p>
    </aside>
    <div id="map"
         th:data-id="${calculation.id}"
         th:data-origin-lat="${originLatitude}"
         th:data-origin-lon="${originLongitude}"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<script th:src="@{/map.js}" type="module"></script>
</body>
</html>
