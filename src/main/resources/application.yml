spring:
  application:
    name: totleben
  datasource:
    url: jdbc:postgresql://localhost:5432/totleben
    username: totleben
    password: totleben
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
  cloud:
    aws:
      credentials:
        access-key: totleben
        secret-key: totleben-secret
      region:
        static: us-east-1
      s3:
        endpoint: http://localhost:8333
        region: us-east-1
        path-style-access-enabled: true
        chunked-encoding-enabled: false
        checksum-validation-enabled: false

totleben:
  storage:
    bucket: totleben-results
  map:
    origin-latitude: 44.605
    origin-longitude: 33.522
    max-points: 12000
