spring:
  application:
    name: totleben
  datasource:
    url: jdbc:postgresql://localhost:5432/totleben
    username: totleben
    password: totleben
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false

totleben:
  storage:
    endpoint: http://localhost:8333
    region: us-east-1
    bucket: totleben-results
    access-key: totleben
    secret-key: totleben-secret
  map:
    origin-latitude: 44.605
    origin-longitude: 33.522
    max-points: 12000
