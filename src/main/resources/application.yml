spring:
  application:
    name: positiongen
  datasource:
    url: jdbc:postgresql://localhost:5432/positiongen
    username: positiongen
    password: ${SPRING_DATASOURCE_PASSWORD:positiongen}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  thymeleaf:
    cache: false
  cloud:
    aws:
      credentials:
        access-key: positiongen
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:positiongen-secret}
      region:
        static: us-east-1
      s3:
        endpoint: http://localhost:8333
        region: us-east-1
        path-style-access-enabled: true
        chunked-encoding-enabled: false
        checksum-validation-enabled: false

app:
  storage:
    bucket: positiongen-results
  map:
    origin-latitude: 59.9343
    origin-longitude: 30.3351
    max-points: 12000
  calculation:
    pool-size: 2
